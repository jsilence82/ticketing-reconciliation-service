# Production deployment stack for a small VPS — not a local dev tool. Local
# development runs `go run ./cmd/server` directly against a local Postgres
# (see docs/ENVIRONMENT.md); nothing here is needed for that.
#
# Full rationale (why Compose not Kubernetes, why Caddy, observability
# topology, one-time setup steps, backups) lives in docs/DEPLOYMENT.md — this
# file only carries the service definitions and short per-service notes.
#
# Routine deploy, once set up:
#   docker compose pull && docker compose up -d

services:
  app:
    image: ghcr.io/jsilence82/ticketing-reconciliation-service:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    # No ports: published. Only the reverse proxy is reachable from outside
    # the Compose network — the app is reached at http://app:8080 from
    # inside it, which is what the Caddyfile does.

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: reconciliation
      POSTGRES_USER: reconciler
      # No default — an unset password fails container startup rather than
      # silently using a guessable one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Named volume, not a bind mount into the repo.
      - postgres_data:/var/lib/postgresql/data
    # No ports: published — this holds buyer payment data and must not be
    # reachable from the internet at all, only from other Compose services.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconciler -d reconciliation"]
      interval: 5s
      timeout: 5s
      retries: 10

  proxy:
    # Caddy over nginx: automatic Let's Encrypt TLS with near-zero config —
    # see docs/DEPLOYMENT.md, "Why Caddy, not nginx".
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - grafana

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app
    # No ports: published — scraped from inside the Compose network only,
    # same isolation as postgres. Nothing needs to reach Prometheus directly;
    # Grafana queries it over the internal network.

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      # No default — same rule as POSTGRES_PASSWORD above.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    # Reachable externally via the proxy's grafana.<domain> site block below —
    # unlike postgres/prometheus, Grafana's UI is meant to be used from
    # outside the VPS, gated by its own login rather than network isolation.

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
