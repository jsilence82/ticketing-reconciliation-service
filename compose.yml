# Docker Compose deployment stack for the small VPS described in CLAUDE.md,
# Deployment. This is the PRODUCTION deployment target, not a local dev tool —
# local development runs `go run ./cmd/server` directly against a local
# Postgres (see docs/ENVIRONMENT.md); nothing here is needed for that.
#
# The app image is pulled, never built here — the VPS is explicitly forbidden
# from building its own image (CLAUDE.md, Deployment: "it couples deploys to
# the box having a toolchain and a clean checkout"). `.github/workflows/ci.yml`
# is what produces ghcr.io/<owner>/ticketing-reconciliation-service on every
# merge to main.
#
# Observability: OpenTelemetry (in-process SDK, no separate container) →
# Prometheus → Grafana, per CLAUDE.md's Tech stack section. The app exposes
# Prometheus-formatted metrics on its own internal-only port (METRICS_PORT,
# default 9464) — see internal/metrics and cmd/server/main.go — which is NOT
# the port the proxy below reaches; the Caddyfile's site block proxies
# everything on the app's main port to the internet with no path matching, so
# /metrics has to live somewhere Caddy never sees. prometheus scrapes that
# port over this internal network; grafana queries prometheus the same way
# and is the only one of the two actually reachable externally (via its own
# Caddy site block), since it's the human-facing UI.
#
# One-time setup on the VPS, before the first `up`:
#   1. cp .env.example .env, then fill in production secrets. chmod 600 it.
#      NEVER commit this file — see docs/ENVIRONMENT.md.
#   2. Point DNS at this host (both the main domain and grafana.<domain>),
#      then edit Caddyfile's placeholder domains.
#   3. After the first `up` brings Postgres online, provision the read-only
#      API role ONCE (not automated here — see docs/ENVIRONMENT.md, "The
#      query API's database role"):
#        docker compose exec -T postgres psql -U reconciler -d reconciliation \
#          -v api_password="$(openssl rand -base64 32)" -v DBNAME=reconciliation \
#          -f /dev/stdin < deploy/readonly-role.sql
#      (-T disables TTY allocation so piped stdin actually reaches psql)
#      Put the resulting connection string in .env as API_DATABASE_URL, then
#      `docker compose up -d` again so the app picks it up.
#
# Routine deploy, once set up:
#   docker compose pull && docker compose up -d

services:
  app:
    image: ghcr.io/jsilence82/ticketing-reconciliation-service:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    # No ports: published. CLAUDE.md, Deployment: only the reverse proxy is
    # reachable from outside the Compose network — the app is reached at
    # http://app:8080 from inside it, which is what the Caddyfile does.

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: reconciliation
      POSTGRES_USER: reconciler
      # No default — an unset password fails container startup rather than
      # silently using a guessable one (CLAUDE.md guardrail 4's "secrets have
      # no defaults" principle, applied here too).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Named volume, not a bind mount into the repo (CLAUDE.md, Deployment).
      - postgres_data:/var/lib/postgresql/data
    # No ports: published — this holds buyer payment data and must not be
    # reachable from the internet at all, only from other Compose services.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconciler -d reconciliation"]
      interval: 5s
      timeout: 5s
      retries: 10

  proxy:
    # Caddy over nginx: automatic Let's Encrypt TLS with near-zero config,
    # which suits a low-ops project for one nonprofit (CLAUDE.md, Deployment:
    # "TLS is not optional... but it belongs to the proxy, not this service").
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - grafana

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app
    # No ports: published — scraped from inside the Compose network only,
    # same isolation as postgres. Nothing needs to reach Prometheus directly;
    # Grafana queries it over the internal network.

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      # No default — same "secrets have no defaults" rule as
      # POSTGRES_PASSWORD above (CLAUDE.md guardrail 4).
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    # Reachable externally via the proxy's grafana.<domain> site block below —
    # unlike postgres/prometheus, Grafana's UI is meant to be used from
    # outside the VPS, gated by its own login rather than network isolation.

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
