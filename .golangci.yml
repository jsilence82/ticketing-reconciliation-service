version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - depguard
    - bodyclose
    - misspell
    - revive

  settings:
    depguard:
      rules:
        # internal/recon is the ported reconciliation logic. It must stay a
        # pure library — plain slices in, plain structs out — so the parity
        # harness can drive it directly, and so the matching rule cannot
        # silently diverge from the ported behavior.
        recon-stays-pure:
          files:
            - "**/internal/recon/**"
            - "**/internal/model/**"
          deny:
            - pkg: "database/sql"
              desc: "internal/recon must not touch storage; pass data in as slices"
            - pkg: "net/http"
              desc: "internal/recon must not do I/O; it is a pure library"
            - pkg: "github.com/jackc/pgx"
              desc: "internal/recon must not touch storage; pass data in as slices"
            - pkg: "github.com/jsilence82/ticketing-reconciliation-service/internal/store"
              desc: "internal/recon must not depend on the store package"

        # internal/store is the ONLY package containing SQL. Denying the
        # driver everywhere else turns that from a comment into a build
        # failure, so a query cannot quietly appear in a handler. cmd/ is
        # exempt because binaries construct the pool and pass it in.
        sql-lives-in-store:
          files:
            - "$all"
            - "!**/internal/store/**"
            - "!**/cmd/**"
          deny:
            - pkg: "github.com/jackc/pgx"
              desc: "only internal/store may hold SQL; take a store method instead"
            - pkg: "database/sql"
              desc: "only internal/store may hold SQL; take a store method instead"

    revive:
      rules:
        - name: exported
          disabled: false

  exclusions:
    rules:
      # Test files legitimately ignore errors on cleanup paths.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
