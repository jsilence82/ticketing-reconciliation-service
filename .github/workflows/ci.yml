# Mirrors the shape of fica-ci-bridge's CI: a single build job on ubuntu-latest,
# triggered on push and PR to main, with toolchain caching delegated to the
# setup action. No matrix, no image push, no release job.
#
# One deliberate addition: a lint step. fica-ci-bridge has no linter at all, but
# CLAUDE.md asks for linting on this repo.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # A services block is not a build matrix — the single-job shape CLAUDE.md
    # asks for is preserved. Pinned to the major the VPS will run.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: make fmt

      - name: Vet
        run: make vet

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Test
        # DATABASE_URL is set here rather than at job level so the
        # integration tests cannot silently skip; the helper in
        # internal/store/migrate fails outright if CI is set and the DSN is not.
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/trs_test?sslmode=disable
        run: make test

      - name: Build
        run: make build
