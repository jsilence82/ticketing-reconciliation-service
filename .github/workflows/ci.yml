# Mirrors the shape of fica-ci-bridge's CI: a single build job on ubuntu-latest,
# triggered on push and PR to main, with toolchain caching delegated to the
# setup action. No matrix, no release job.
#
# Two deliberate additions over that shape (see CLAUDE.md, "On the
# fica-ci-bridge reference"):
#   - A lint step. fica-ci-bridge has no linter at all.
#   - An image build+push step, gated to `push` on main only. Deployment here
#     is `compose pull && compose up -d` on a VPS that is explicitly forbidden
#     from building its own image (CLAUDE.md, Deployment) — CI has to be the
#     thing that produces it. Scoped to `push` so a PR branch, which has not
#     been reviewed, never publishes an image anyone could pull.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  # Needed only for the image-push step below; GITHUB_TOKEN is sufficient for
  # ghcr.io, so no extra registry secret has to be managed.
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    # A services block is not a build matrix — the single-job shape CLAUDE.md
    # asks for is preserved. Pinned to the major the VPS will run.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: make fmt

      - name: Vet
        run: make vet

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Test
        # DATABASE_URL is set here rather than at job level so the
        # integration tests cannot silently skip; the helper in
        # internal/store/migrate fails outright if CI is set and the DSN is not.
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/trs_test?sslmode=disable
        run: make test

      - name: Build
        run: make build

      # Everything below only runs on a genuine merge to main, never on a PR —
      # the checks above already gate that merge, so by this point the code is
      # trusted enough to publish.
      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
